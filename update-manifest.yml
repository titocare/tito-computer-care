name: Update Image Manifest

on:
  push:
    paths:
      - 'assets/laptops/**'
      - 'assets/repairs/**'
      - 'assets/parts/**'

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json for each gallery folder
        run: |
          for folder in laptops repairs parts; do
            mkdir -p "assets/$folder"
            find "assets/$folder" -maxdepth 1 -type f \
              \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
              -printf "%f\n" | sort | jq -R -s -c 'split("\n")[:-1]' > "assets/$folder/manifest.json"
          done

      - name: Commit manifest files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/laptops/manifest.json assets/repairs/manifest.json assets/parts/manifest.json
          git diff --staged --quiet || git commit -m "chore: auto-update image manifest"
          git push
